[project]
name = "bongo-markets"
version = "0.1.0"
description = "Bongo Markets – multi-shop marketplace (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "phonenumbers>=8.13",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "cryptography>=42",
  "Pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S603", "S607"]
"app/web/pages.py" = ["E501"]
"app/web/layout.py" = ["E501"]
"app/auth/web.py" = ["E501"]
"app/auth/security_web.py" = ["E501"]
"app/authz/web.py" = ["E501"]
"app/shops/web.py" = ["E501"]
"app/catalog/web.py" = ["E501"]
"app/market/web.py" = ["E501"]
"app/orders/web.py" = ["E501"]
"app/core/modules.py" = ["E501"]
