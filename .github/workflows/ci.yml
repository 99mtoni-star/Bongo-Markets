name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test catalogue (DEV-004)
        run: python scripts/check_catalogue.py
      - name: Protected-control regression (DEV-005)
        run: python -m pytest -q -m protected
      - name: Full regression
        run: python -m pytest -q
